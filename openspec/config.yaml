schema: spec-driven

context: |
  Project: simu_tanque (tank simulation, academic modeling).
  Workspace: simulator/ (web app), Simulink/ (MATLAB model), docs/ (Spanish
  documentation), entrega/ (deliverables, empty).
  Stack: Next.js 16.3.3, React 19, TypeScript 5.7.3 (strict), Tailwind 4,
  shadcn/base-ui, Recharts 3, pnpm. Math model in
  simulator/lib/water-tank-model.ts.
  Conventions: conventional commits, Spanish docs. No linter, formatter or CI.
  Testing: no runner. Type-checking through the simulator build is the only
  quality gate.
  Strict TDD is OFF until a workspace test command exists.

projects:
  - path: simulator
    stack: Next.js 16.3.3, React 19, TypeScript 5.7.3 (strict), Tailwind 4, Recharts 3
    package_manager: pnpm
    build_command: pnpm build
    test_command: ""
    lint_command: ""
  - path: Simulink
    stack: MATLAB Simulink model (simulacion_tanqueAgua.slx)
    build_command: ""
    test_command: ""
    lint_command: ""

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "pnpm --dir simulator build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
