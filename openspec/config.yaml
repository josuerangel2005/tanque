schema: spec-driven

context: |
  Project: simu_tanque (tank simulation, academic modeling).
  Workspace holds only 'Modelo matematico del Tanque.docx'; no code yet.
  Stack: none detected. Architecture: none. Testing: no runner.
  Strict TDD is OFF until a stack and workspace test command exist.

projects: []

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
